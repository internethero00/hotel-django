services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      POSTGRES_HOST: db
    ports:
      - "9000:9000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: